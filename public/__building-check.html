<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Building visibility check</title>
  </head>
  <body style="margin: 0; font: 14px monospace">
    <button id="inspect">Inspect current camera</button>
    <button id="sweep">Sweep camera angles</button>
    <button id="rotate">Rotate 90 degrees</button>
    <button id="tilt">Pitch 70 degrees</button>
    <pre id="results" style="height: 140px; overflow: auto; margin: 0"></pre>
    <iframe
      id="app"
      title="Berlin map"
      style="border: 0; width: 100%; height: calc(100vh - 165px)"
      src="/?debug=visibility-check#14.2/52.52/13.405/-18/55"
    ></iframe>
    <script type="module">
      const app = document.querySelector("#app");
      const results = document.querySelector("#results");
      const getMap = () => app.contentWindow.__map;
      function inspect() {
        const map = getMap();
        if (!map?.isStyleLoaded()) return { ready: false };
        const sources = {};
        for (const [id, manager] of Object.entries(map.style.tileManagers)) {
          const zooms = {};
          for (const key of manager.getRenderableIds()) {
            const zoom = manager.getTileByID(key).tileID.canonical.z;
            zooms[zoom] = (zooms[zoom] ?? 0) + 1;
          }
          const source = map.getSource(id);
          sources[id] = {
            zooms,
            maxzoom: source.maxzoom,
            customLod: !!source.calculateTileZoom,
          };
        }
        const buildings = map.queryRenderedFeatures({
          layers: ["building-3d", "building-massing"],
        });
        return {
          zoom: map.getZoom(),
          pitch: map.getPitch(),
          bearing: map.getBearing(),
          buildings: buildings.length,
          sources,
        };
      }
      document.querySelector("#inspect").onclick = () => {
        results.textContent = JSON.stringify(inspect());
      };
      document.querySelector("#rotate").onclick = () => {
        const map = getMap();
        map.jumpTo({ bearing: map.getBearing() + 90 });
      };
      document.querySelector("#tilt").onclick = () => {
        getMap().jumpTo({ pitch: 70 });
      };
      document.querySelector("#sweep").onclick = async () => {
        const map = getMap();
        results.textContent = "Running…";
        const measurements = [];
        for (const zoom of [13.6, 14.2, 15.6]) {
          for (const pitch of [55, 65, 70, 78]) {
            for (const bearing of [-135, -90, -45, 0, 45, 90, 135, 180]) {
              await new Promise((resolve) => {
                map.once("idle", resolve);
                map.jumpTo({ center: [13.405, 52.52], zoom, pitch, bearing });
              });
              measurements.push(inspect());
              results.textContent = JSON.stringify({
                done: measurements.length,
                last: measurements.at(-1),
              });
            }
          }
        }
        results.textContent = JSON.stringify({
          done: measurements.length,
          measurements,
        });
      };
    </script>
  </body>
</html>
